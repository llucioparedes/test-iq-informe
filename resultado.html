      <g transform="translate(6 -10.4) scale(.80)">${redNeuronal()}</g>
      ${electron(0, 0)}${electron(60, Math.PI)}${electron(120, 0)}
    </g>
  </svg>`;
}

/* ---- Campana (de informe.html) ---- */
function campanaSVG(indice){
  const W = 320, H = 172, L = 14, Rg = 14, top = 16, base = H - 34;
  const d0 = 55, d1 = 145, peak = base - top;
  const clamp = v => Math.max(d0, Math.min(d1, v));
  const ind = clamp(indice);
  const xOf = v => L + (v - d0) / (d1 - d0) * (W - L - Rg);
  const g = v => Math.exp(-Math.pow(v - 100, 2) / (2 * 15 * 15));
  const yOf = v => base - g(v) * peak;
  let curve = '', area = 'M' + xOf(d0).toFixed(1) + ' ' + base.toFixed(1);
  for(let v = d0; v <= d1; v++){
    curve += (v === d0 ? 'M' : 'L') + xOf(v).toFixed(1) + ' ' + yOf(v).toFixed(1) + ' ';
    area  += ' L' + xOf(v).toFixed(1) + ' ' + yOf(v).toFixed(1);
  }
  area += ' L' + xOf(d1).toFixed(1) + ' ' + base.toFixed(1) + ' Z';
  const ticks = [70,85,100,115,130].map(t =>
    `<line x1="${xOf(t).toFixed(1)}" y1="${base}" x2="${xOf(t).toFixed(1)}" y2="${base+4}" stroke="#CBD5E1"/>`+
    `<text x="${xOf(t).toFixed(1)}" y="${base+16}" text-anchor="middle" font-size="9" fill="#94A3B8">${t}</text>`).join('');
  const mx = xOf(ind), my = yOf(ind);
  const lblY = Math.min(Math.max(my - 30, 2), base - 42);
  const id = 'cl' + Math.random().toString(36).slice(2,7);
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tu posición en la distribución poblacional">
    <defs>
      <clipPath id="${id}"><rect class="cl-rect" x="${L}" y="0" width="0" height="${H}"/></clipPath>
      <linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#0E8A68" stop-opacity=".40"/>
        <stop offset="1" stop-color="#0E8A68" stop-opacity=".04"/>
      </linearGradient>
    </defs>
    <line x1="${L}" y1="${base}" x2="${W-Rg}" y2="${base}" stroke="#E2E8F0"/>
    <path d="${area}" fill="url(#${id}g)" clip-path="url(#${id})"/>
    <path d="${curve}" fill="none" stroke="#0A5B46" stroke-width="2.2" stroke-linejoin="round"/>
    ${ticks}
    <g class="marca-g" opacity="0">
      <line x1="${mx.toFixed(1)}" y1="${base}" x2="${mx.toFixed(1)}" y2="${(my-1).toFixed(1)}" stroke="#C9A227" stroke-width="2.2" stroke-dasharray="3 2"/>
      <circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="5.5" fill="#C9A227" stroke="#fff" stroke-width="2"/>
      <rect x="${(mx-31).toFixed(1)}" y="${lblY.toFixed(1)}" width="62" height="19" rx="9" fill="#0A5B46"/>
      <text x="${mx.toFixed(1)}" y="${(lblY+13).toFixed(1)}" text-anchor="middle" font-size="10.5" font-weight="800" fill="#fff">Tú · ${indice}</text>
    </g>
  </svg>`;
  return {svg, clipw:+(mx - L).toFixed(1)};
}
function animarCampana(el){
  const svg = el.querySelector('svg'); if(!svg) return;
  const rect = svg.querySelector('.cl-rect'), marca = svg.querySelector('.marca-g');
  const target = +el.dataset.clipw, t0 = performance.now(), dur = 1100;
  (function step(t){
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    rect.setAttribute('width', (target * e).toFixed(1));
    marca.setAttribute('opacity', k > 0.55 ? ((k - 0.55) / 0.45).toFixed(2) : '0');
    if(k < 1) requestAnimationFrame(step);
  })(performance.now());
}

function ordenarRadar(radar){
  const oo = n => ORDEN_OFICIAL.indexOf(n);
  return [...radar].sort((a,b) =>
      (b.porcentaje - a.porcentaje) || (b.pesoAcumulado - a.pesoAcumulado) || (oo(a.nombre) - oo(b.nombre)));
}
function interpretaNumero(indice){
  if(indice < 80)  return 'Un <b>'+indice+'</b> entra en el rango «en desarrollo». El índice no cuenta aciertos: pondera la dificultad, y ahí está tu mayor margen de mejora.';
  if(indice < 95)  return 'Un <b>'+indice+'</b> te sitúa en la franja media, donde se agrupa la mayoría. Tu perfil de fortalezas dice más de ti que el número solo.';
  if(indice < 110) return 'Un <b>'+indice+'</b> ronda la media, pero con áreas que sobresalen del resto: ahí está lo interesante de tu perfil.';
  if(indice < 120) return 'Un <b>'+indice+'</b> está por encima de la media: entraste con éxito en el terreno difícil del test, no solo en lo accesible.';
  if(indice < 130) return 'Un <b>'+indice+'</b> es un resultado alto: sostienes de forma consistente los ejercicios de mayor peso.';
  return 'Un <b>'+indice+'</b> es un resultado destacado: superas a casi toda la población resolviendo lo más difícil de forma consistente.';
}
/* Detalle del percentil / posición en la campana (adaptado al valor) */
function explicaPercentil(p){
  const base = `De cada 100 personas que hacen este test, quedas por delante de <b>${p}</b>.`;
  let pos;
  if(p <= 25)      pos = 'En la campana caes a la izquierda de la media: aquí el número por sí solo dice poco, y lo que de verdad te define es tu perfil por áreas.';
  else if(p <= 69) pos = 'Caes cerca del centro de la curva, la zona más poblada, donde se agrupa la mayoría. Dos personas con tu mismo percentil pueden tener perfiles muy distintos: por eso pesan tus fortalezas, no solo el total.';
  else if(p <= 89) pos = 'Te ubicas a la derecha de la media, en la zona alta de la curva, donde ya hay bastante menos gente que tú.';
  else             pos = 'Estás en el extremo derecho de la campana, la zona más rara: muy pocas personas llegan hasta aquí.';
  return `${base} ${pos} La <b>línea dorada</b> marca tu lugar exacto en la curva.`;
}

/* 📧 Captura del correo ANTES de enseñar el resultado gratis.
   Sin esto, quien hace el test y no compra se pierde para siempre: no queda
   forma de volver a hablarle. El correo se guarda junto con su resultado. */
function pantallaCapturarEmail(r){
  app.innerHTML = `<div class="card centro">
    <div class="logo">${LOGO()}</div>
    <h1 class="j">Tu resultado está listo</h1>
    <p>Escribe tu correo y te mostramos <b>tu coeficiente, tu percentil y tus 3 fortalezas cognitivas</b>.</p>
    <div style="margin:1.1rem 0 .3rem;text-align:left">
      <input class="inp" type="email" id="email-lead" placeholder="tucorreo@ejemplo.com"
        autocomplete="email" inputmode="email">
      <div class="msg" id="lead-msg"></div>
    </div>
    <button class="btn" id="ver-lead">Ver mi resultado →</button>
    <p class="nota" style="margin-top:.9rem">Es gratis. No compartimos tu correo con nadie.</p>
  </div>`;
  const inp = document.querySelector('#email-lead');
  const mostrar = () => {
    const email = (inp.value||'').trim().toLowerCase();
    const msg = document.querySelector('#lead-msg');
    if(!email || !email.includes('@') || !email.includes('.')){
      msg.textContent = 'Escribe un correo válido.'; msg.style.display='block'; inp.focus(); return;
    }
    try { localStorage.setItem('emailInforme', email); } catch(e){}
    // Se guarda en segundo plano: si falla la red, igual ve su resultado.
    fetch(SUPABASE_FN + '/guardar-resultado', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email, resultado: r })
    }).catch(()=>{});
    if(typeof fbq === 'function') fbq('track', 'Lead');
    pantallaResultado(r);
  };
  document.querySelector('#ver-lead').onclick = mostrar;
  inp.addEventListener('keydown', e => { if(e.key === 'Enter') mostrar(); });
  inp.focus();
}

    <button class="btn" id="ver">Ver mi resultado</button>
  </div>`;
  const inp = document.querySelector('#email-ver');

}

/* Verifica el pago en Supabase (mismo endpoint que el informe) */
async function desbloquearPorEmail(email, auto){
  const cargando = (m) => { app.innerHTML = `<div class="card centro"><div class="logo">${LOGO()}</div>
    <h1>Verificando tu compra…</h1><p>${m||'Un momento, preparando tu resultado.'}</p></div>`; };
  cargando();
  const intentos = auto ? 7 : 1;
  let huboError = false;
  for(let i=0; i<intentos; i++){
    let data = null;
    try {
      const res = await fetch(SUPABASE_FN + '/verificar', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ email })
      });
      data = await res.json();
    } catch(e){ data = null; huboError = true; }

    if(data && data.pagado){
      try { localStorage.setItem('emailInforme', email); } catch(e){}
      let r = data.resultado;
      if(!r || !r.completado){
        try {
          const g = JSON.parse(localStorage.getItem('resultadoTestIQ'));
          if(g && g.completado){
            r = g;
            fetch(SUPABASE_FN + '/guardar-resultado', {
              method:'POST', headers:{'Content-Type':'application/json'},
              body: JSON.stringify({ email, resultado: g })
            }).catch(()=>{});
          }
        } catch(e){}
      }
      if(r){ pantallaResultado(r); return; }
      pantallaPedirEmail('Tu compra está confirmada 👍. Ábrelo en el mismo navegador donde hiciste el test (ahí quedó guardado tu resultado).');
      return;
    }
    if(data){ huboError = false; }
    if(i < intentos - 1){
      cargando('Confirmando tu compra, puede tardar unos segundos…');
      await new Promise(r => setTimeout(r, 3000));
    }
  }
  if(huboError){ pantallaPedirEmail('No pudimos conectar. Revisa tu internet e inténtalo de nuevo.'); return; }
  pantallaPedirEmail(auto ? '' : 'No encontramos una compra con ese correo. Usa el mismo correo con el que pagaste.');
}

/* Arranque */
(function init(){
  const params = new URLSearchParams(location.search);
  const hash = (location.hash||'').replace(/^#/,'');
  if(params.get('demo') === '1' || hash === 'demo'){
    pantallaResultado({indice:130, percentil:98, radar:[
      {nombre:'Razonamiento Lógico',porcentaje:99,pesoAcumulado:12,ok:8},
      {nombre:'Razonamiento Abstracto',porcentaje:98,pesoAcumulado:11,ok:8},
      {nombre:'Razonamiento Cuantitativo',porcentaje:88,pesoAcumulado:10,ok:7},
      {nombre:'Reconocimiento de Patrones',porcentaje:75,pesoAcumulado:9,ok:6},
      {nombre:'Visualización Espacial',porcentaje:63,pesoAcumulado:8,ok:5}
    ]});
    return;
  }
  const emailURL = (params.get('email')||'').trim().toLowerCase();
  const conClave = params.get('ver') === 'resultados' && params.get('clave') === CLAVE_REVISION;
  if(conClave){
    try { const g = JSON.parse(localStorage.getItem('resultadoTestIQ')); if(g && g.completado){ pantallaResultado(g); return; } } catch(e){}
  }
  /* MODELO B: el test es gratis. Si hay un resultado local (recién hecho el test
     en este navegador) se muestra GRATIS, pero PIDIENDO EL CORREO ANTES: sin eso
     la persona se va sin dejar rastro. Si ya dio su correo antes, no se le
     vuelve a pedir. La verificación por email queda de respaldo para quien
     vuelva desde otro dispositivo. */
  try {
    const g = JSON.parse(localStorage.getItem('resultadoTestIQ'));
    if(g && g.completado){
      let yaDioCorreo = null;
      try { yaDioCorreo = localStorage.getItem('emailInforme'); } catch(e){}
      if(yaDioCorreo) pantallaResultado(g); else pantallaCapturarEmail(g);
      return;
    }
  } catch(e){}
  if(emailURL){ desbloquearPorEmail(emailURL, true); return; }
  let saved = null;
  try { saved = localStorage.getItem('emailInforme'); } catch(e){}
  if(saved){ desbloquearPorEmail(saved, true); return; }
  pantallaPedirEmail();
})();
